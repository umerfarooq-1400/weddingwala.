<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeddingWala - Venue Discovery & Slot Booking</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- Header Navigation -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 font-bold text-2xl text-rose-600">
                <i class="fa-solid font-bold fa-ring"></i>
                <span>Wedding<span class="text-slate-900">Wala</span></span>
            </a>
            <nav class="hidden md:flex items-center gap-6 font-medium text-sm">
                <a href="/" class="text-rose-600">Venues</a>
                <a href="/owner-dashboard.html" class="text-slate-600 hover:text-rose-600">Venue Owner Portal</a>
                <a href="/admin.html" class="text-slate-600 hover:text-rose-600">Admin Panel</a>
            </nav>
            <a href="/list-venue.html" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                List Your Venue
            </a>
        </div>
    </header>

    <!-- Hero Search Section -->
    <section class="bg-gradient-to-r from-rose-900 via-rose-800 to-slate-900 text-white py-16 px-4 text-center">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl md:text-5xl font-extrabold mb-4">Find & Lock Your Perfect Wedding Venue</h1>
            <p class="text-rose-100 text-base md:text-lg mb-8">Transparent pricing, real-time availability, and instant slot reservations in Karachi.</p>
            
            <!-- Search Filter Bar -->
            <div class="bg-white p-3 rounded-2xl shadow-xl text-slate-800 flex flex-col md:flex-row gap-3">
                <input type="text" id="searchInput" placeholder="Search by area or venue name..." class="flex-1 px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500">
                <input type="date" id="dateFilter" class="px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500">
                <button onclick="fetchVenues()" class="bg-rose-600 hover:bg-rose-700 text-white px-8 py-3 rounded-xl font-bold transition">
                    Search
                </button>
            </div>
        </div>
    </section>

    <!-- Venue Marketplace Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-slate-900">Featured Banquets & Venues</h2>
            <span id="venueCount" class="text-sm font-semibold bg-rose-100 text-rose-700 px-3 py-1 rounded-full">Loading...</span>
        </div>

        <div id="venueGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Dynamic Cards Will Load Here -->
        </div>
    </main>

    <!-- Booking / Slot Lock Modal -->
    <div id="bookingModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            <h3 class="text-xl font-bold text-slate-900 mb-2">Hold / Lock Event Slot</h3>
            <p id="modalVenueName" class="text-sm text-slate-500 mb-4"></p>

            <form id="bookingForm" onsubmit="handleSlotLock(event)" class="space-y-4">
                <input type="hidden" id="modalVenueId">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Your Full Name</label>
                    <input type="text" id="custName" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Phone Number (WhatsApp)</label>
                    <input type="tel" id="custPhone" required placeholder="03001234567" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-rose-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Date</label>
                        <input type="date" id="bookDate" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-rose-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Slot</label>
                        <select id="bookSlot" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-rose-500">
                            <option value="Night">Night (7 PM - 10 PM)</option>
                            <option value="Day">Day (1 PM - 4 PM)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Expected Guests</label>
                    <input type="number" id="guestCount" placeholder="300" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-rose-500">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-lg transition mt-2">
                    Lock Slot Now
                </button>
            </form>
        </div>
    </div>

    <!-- Script to Handle API Requests -->
    <script>
        async function fetchVenues() {
            try {
                const res = await fetch('/api/venues');
                const data = await res.json();
                
                const grid = document.getElementById('venueGrid');
                const count = document.getElementById('venueCount');
                grid.innerHTML = '';

                if (data.success && data.venues.length > 0) {
                    count.textContent = `${data.venues.length} Available`;
                    data.venues.forEach(venue => {
                        grid.innerHTML += `
                            <div class="bg-white rounded-2xl border shadow-sm hover:shadow-md transition overflow-hidden">
                                <img src="${venue.images?.[0] || 'https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=600&q=80'}" class="w-full h-48 object-cover">
                                <div class="p-5">
                                    <div class="flex justify-between items-start mb-2">
                                        <h3 class="font-bold text-lg text-slate-900">${venue.name}</h3>
                                        <span class="text-xs bg-amber-100 text-amber-800 font-bold px-2 py-1 rounded">★ ${venue.avgRating || '4.5'}</span>
                                    </div>
                                    <p class="text-slate-500 text-sm mb-4"><i class="fa-solid fa-location-dot text-rose-500 mr-1"></i> ${venue.address || 'Karachi'}</p>
                                    <div class="flex justify-between items-center border-t pt-4">
                                        <div>
                                            <span class="text-xs text-slate-400 block">Starting from</span>
                                            <span class="font-extrabold text-slate-900">Rs. ${Number(venue.capacity ? venue.capacity * 1000 : 150000).toLocaleString()}</span>
                                        </div>
                                        <button onclick="openModal('${venue._id}', '${venue.name}')" class="bg-rose-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-rose-700">
                                            Lock Slot
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    count.textContent = '0 Found';
                    grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-12">No approved venues found right now.</p>`;
                }
            } catch (err) {
                console.error(err);
            }
        }

        function openModal(id, name) {
            document.getElementById('modalVenueId').value = id;
            document.getElementById('modalVenueName').textContent = name;
            document.getElementById('bookingModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('bookingModal').classList.add('hidden');
        }

        async function handleSlotLock(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            const payload = {
                venueId: document.getElementById('modalVenueId').value,
                customerName: document.getElementById('custName').value,
                customerPhone: document.getElementById('custPhone').value,
                bookingDate: document.getElementById('bookDate').value,
                slot: document.getElementById('bookSlot').value,
                guestCount: document.getElementById('guestCount').value,
                status: 'Pending'
            };

            try {
                const res = await fetch('/api/bookings/lock-slot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    alert('Slot locked successfully!');
                    closeModal();
                } else {
                    alert(data.message || 'Slot locking failed.');
                }
            } catch (err) {
                alert('Server error occurred.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Lock Slot Now';
            }
        }

        // Initialize Market Data
        fetchVenues();
    </script>
</body>
</html>
